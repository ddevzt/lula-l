  return `<div class="panel"><h2>Com qual partido você quer jogar?</h2><div class="pick">${S.cfg.parties.map(p=>`<button data-act="newgame" data-v="${p.id}">${logo(p)}<span><b>${esc(p.sigla)}</b> — ${esc(p.cand.nome)}</span></button>`).join('')}</div></div>`;
}
 
/* ----- Eventos de interface ----- */
function setPath(o,path,val){const k=path.split('.');for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=val}
document.addEventListener('input',e=>{
  const t=e.target;if(t.id==='ans'){S.draft=t.value;return}if(!t.dataset||!t.dataset.path)return;
  let v=t.value;if(t.dataset.t==='n'){v=parseFloat(v);if(isNaN(v))return}
  try{setPath(S.cfg,t.dataset.path,v)}catch(err){return}
  if(t.type==='range'&&t.nextElementSibling)t.nextElementSibling.textContent=v;
  saveCfg();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='proj-json'||t.id==='crise-json'){
    try{const d=JSON.parse(t.value);if(!Array.isArray(d))throw 0;if(t.id==='proj-json')S.cfg.projects=d;else S.cfg.crises=d;saveCfg();toast('Atualizado.')}catch(err){toast('JSON inválido: nada foi alterado.')}
  }
  if(t.id==='dec-json'){
    try{const d=JSON.parse(t.value);if(!Array.isArray(d))throw 0;S.cfg.decisions=d;saveCfg();toast('Decisões atualizadas.')}catch(err){toast('JSON inválido: as decisões não foram alteradas.')}
  }
  if(t.dataset&&t.dataset.path&&t.tagName==='SELECT'){setPath(S.cfg,t.dataset.path,t.value);saveCfg()}
  if(t.dataset&&t.dataset.path&&t.type==='color'){setPath(S.cfg,t.dataset.path,t.value);saveCfg()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'nav':S.screen=v;S.pickOpen=false;render();break;
    case 'tab':S.tab=v;render();break;
    case 'etab':S.etab=v;render();break;
    case 'newpick':S.pickOpen=true;if(S.screen!=='editor'&&S.screen!=='home')S.screen='home';render();break;
    case 'newgame':
      S.g=newGame(S.cfg,v);S.screen='game';S.tab='painel';S.pickOpen=false;saveGame();
      if(!load('sp.tut')){S.tut=true;store('sp.tut',1)}
      render();break;
    case 'continue':if(S.g){S.screen='game';render()}break;
    case 'adv':advance(parseInt(v,10));break;
    case 'do':doAction(v);break;
    case 'choose':choose(parseInt(v,10));break;
    case 'tutclose':S.tut=false;render();break;
    case 'rand':S.cfg=randomCfg();saveCfg();render();toast('Cenário aleatório gerado.');break;
    case 'reset':S.cfg=defaultCfg();saveCfg();render();toast('Cenário padrão restaurado.');break;
    case 'addmin':S.cfg.ministries.push({nome:'Novo ministério',orc:20,pop:50});saveCfg();render();break;
    case 'delmin':S.cfg.ministries.splice(parseInt(v,10),1);saveCfg();render();break;
    case 'addev':S.cfg.events.push(ev('Novo','Novo evento afeta {p}','random',-1,0,0,0));saveCfg();render();break;
    case 'delev':S.cfg.events.splice(parseInt(v,10),1);saveCfg();render();break;
    case 'count':countVotes();break;
    case 'endorse':{const g=S.g,f=$('#endorse').value;if(!f||g.endorsed)break;g.endorsed=f;addPop(g,f,2.5);g.cap=Math.min(100,g.cap+5);news(g,'Eleição',`Você declara apoio a ${pty(g,f).cand.nome} (${pty(g,f).sigla}) no 2º turno.`,'neutral',true);saveGame();render();toast('Apoio declarado.');break}
    case 'month':if(S.g.mode!=='campanha'){monthStep(S.g);saveGame();render();if(S.g.gov.crisis)toast('Uma crise exige sua decisão.')}break;
    case 'gact':govAct(b.dataset.k,v);break;
    case 'nextcycle':{startNextCycle(S.g,false);saveGame();render();break}
    case 'toggleReal':S.g.showReal=!S.g.showReal;saveGame();render();break;
    case 'poll':commissionPoll();break;
    case 'startdebate':startDebate();break;
    case 'skipdebate':skipDebate();break;
    case 'submitans':submitAnswer();break;
    case 'abortai':if(S.abort)S.abort.abort();break;
    case 'toggleai':S.useAI=!S.useAI;render();break;
    case 'addinst':if(S.cfg.institutes.length<8){S.cfg.institutes.push({nome:'Novo instituto',metodo:'Presencial',vies:0,custo:1,amostra:2000});saveCfg();render()}break;
    case 'delinst':if(S.cfg.institutes.length>1){S.cfg.institutes.splice(parseInt(v,10),1);saveCfg();render()}else toast('Mantenha ao menos um instituto.');break;
    case 'copy':{
      const ta=$('#io-out');ta.select();
      let ok=false;try{ok=document.execCommand('copy')}catch(err){}
      if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast('JSON copiado.'),()=>toast('Selecione o texto e copie manualmente.'))}
      else toast(ok?'JSON copiado.':'Selecione o texto e copie manualmente.');
      break}
    case 'import':{
      try{
        const o=JSON.parse($('#io-in').value);
        if(v==='save'){if(!o.cfg||!o.popUF)throw 0;S.g=o;saveGame();S.screen='game'}
        else{if(!o.parties||!o.ufs)throw 0;S.cfg=o;saveCfg()}
        render();toast('Importado com sucesso.');
      }catch(err){toast('Não foi possível ler esse JSON. Confira se ele veio de uma exportação deste jogo.')}
      break}
  }
});
migrate(S.g);
(async()=>{
  try{if(window.claude&&window.claude.use){S.sample=await window.claude.use('sample')}}catch(e){S.sample=null}
  if(S.screen==='game'&&!S.busy)render();
})();
render();
</script>
</body>
</html>
